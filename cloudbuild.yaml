# Phase 6 — CI/CD: build → Artifact Registry → migrate → Cloud Run (health-gated).
#
# Flow: build image → push → `prisma migrate deploy` → deploy a NEW revision with
# `--no-traffic` (tagged `candidate`) → probe its /health/ready → only then shift 100% of
# traffic to it. If the probe fails the build fails and the OLD revision keeps serving
# (automatic effective rollback).
#
# Secrets come from Secret Manager (see availableSecrets); non-secret config via --set-env-vars.
# Trigger: connect this repo in Cloud Build with substitutions for _REGION/_REPO/_SERVICE.

substitutions:
  _REGION: asia-northeast1
  _REPO: jobfit               # Artifact Registry repo
  _SERVICE: jobfit-backend    # Cloud Run service name
  # Browser origins allowed to call the API with credentials. Exact matches only —
  # a wildcard is invalid once cookies are in play. Deployed frontend + local dev.
  _CORS_ORIGIN: 'https://jobfit-frontend-six.vercel.app,http://localhost:3000'
  # Versioned base URL of jobfits-ai-service — MUST include the /api/v1 suffix.
  #
  # DELIBERATELY EMPTY until the AI service is actually deployed. Leaving it blank makes
  # the backend fall back to ai.config.ts's localhost default, where nothing is listening
  # on Cloud Run: every AI call then fails NETWORK, every path degrades (template cover
  # letters, heuristic scores, unmatched profiles) and /health/ready reports
  # `ai.degraded: true` with the reason. That is the honest behaviour for "not deployed
  # yet" — and pointing this at a URL that does not exist would produce the same outage
  # while looking configured.
  #
  # Set it when the AI service has a host. See docs/AI_DEGRADATION_PLAN.md §6, item 5.
  _AI_SERVICE_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    # DIRECT_URL is REQUIRED by the migrate step, not optional. prisma/schema.prisma
    # declares `directUrl = env("DIRECT_URL")`, and Prisma validates every env var the
    # datasource references before it runs — so `migrate deploy` aborts with P1012
    # ("Environment variable not found: DIRECT_URL") when it is absent, regardless of
    # DATABASE_URL being set. It must be the SESSION-mode connection (port 5432):
    # migrations need a real session, which the transaction pooler cannot give.
    - versionName: projects/$PROJECT_ID/secrets/DIRECT_URL/versions/latest
      env: DIRECT_URL

steps:
  # 1) Build the image (tagged with the commit SHA + latest).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '.'

  # 2) Push (both tags).
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  # 3) Apply pending Prisma migrations (never migrate dev). Runs from the source workspace
  #    (which has prisma/schema.prisma + migrations) in a clean root node image — the app
  #    image runs as non-root and has the prisma CLI pruned, so we don't use it here.
  - id: migrate
    name: node:22
    entrypoint: npx
    args: ['--yes', 'prisma@5.22.0', 'migrate', 'deploy']
    # Both, and DIRECT_URL is not decorative — see availableSecrets above.
    secretEnv: ['DATABASE_URL', 'DIRECT_URL']

  # 4) Deploy a new revision WITHOUT traffic, addressable via the `candidate` tag.
  #    Secrets are wired from Secret Manager; non-secret config via env vars.
  # Cloud Run health-gates the rollout itself: a new revision only receives traffic after it
  # boots and its startup check passes; a failed revision leaves the previous one serving.
  # (For zero-downtime canaries later, switch to --no-traffic --tag=candidate + a health-gate
  #  step — that only works once the service already exists.)
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      # 1 GiB, not Cloud Run's 512 MiB default. The location resolver holds the
      # GeoNames place table in memory — MEASURED at +70.5 MB retained (34,129 places,
      # 316,522 lookup keys) — so that resolving a job's location never costs a database
      # query on `/recommendations/by-job`, which the extension calls once per job page
      # a user views. At 512 MiB that index competes with Node + Nest + Prisma for the
      # same budget. See docs/LOCATION_MATCHING_B_IMPLEMENTATION.md phase 1.
      - '--memory=1Gi'
      # TRACE_ENABLED=false until the runtime SA has roles/cloudtrace.agent.
      # Delimiter is ^|^ (not the default comma) because CORS_ORIGIN is itself a
      # comma-separated list. It cannot be ^@^ either: EMAIL_USER/SMTP_FROM contain '@'.
      # EMAIL_* (minus the password, which is a secret below) enables verification and
      # password-reset mail. These are REQUIRED: email verification gates login, so
      # EmailService refuses to boot under NODE_ENV=production when HOST/USER/PASS are
      # missing — the deploy fails loudly instead of shipping a revision that accepts
      # registrations it can never complete. A *wrong* EMAIL_PASS still boots (the SMTP
      # handshake is async); that surfaces as mail.degraded on /health/ready.
      # SMTP_FROM must match the authenticated Gmail account, otherwise Gmail rewrites it.
      # REDIS_PREFIX namespaces every key this app writes, so two environments sharing one
      # Redis instance cannot collide on `lockout:*` / `blacklist:*` (Redis audit R7).
      # Each environment needs its OWN value: dev:, staging:, prod:.
      - '--set-env-vars=^|^NODE_ENV=production|LOG_FORMAT=json|LOG_LEVEL=info|METRICS_ENABLED=true|TRACE_ENABLED=false|SERVICE_NAME=${_SERVICE}|SERVICE_VERSION=$BUILD_ID|GCP_PROJECT_ID=$PROJECT_ID|CORS_ORIGIN=${_CORS_ORIGIN}|REDIS_PREFIX=prod:|EMAIL_HOST=smtp.gmail.com|EMAIL_PORT=587|EMAIL_USER=soviseth869@gmail.com|SMTP_FROM=JobFit Support <soviseth869@gmail.com>|AI_SERVICE_URL=${_AI_SERVICE_URL}'
      # AI_SERVICE_KEY is the shared secret for jobfits-ai-service (sent as
      # X-AI-Service-Key). It pairs with _AI_SERVICE_URL above: the URL is public config,
      # the key is not. Both are needed — a URL without a key gets 401 on every call
      # except /health and /ready.
      #
      # REDIS_URL is now wired from Secret Manager. It was deliberately omitted for a long
      # time — "the secret exists but its value is unverified, and a bad host is worse
      # than none". Two things changed that calculation:
      #
      #   1. A bad host no longer takes the service down. RedisService is lazyConnect with
      #      a non-fatal onModuleInit, retries forever with a 5s ceiling (R4), and bounds
      #      every command at 2s (R10). A wrong value now costs degraded caching and a log
      #      line, not a boot failure.
      #   2. Both clients finally agree on where Redis is. BullMQ used to read only
      #      REDIS_HOST/REDIS_PORT, so setting REDIS_URL alone would have connected the
      #      cache and left the job queue on localhost, silently. Both now resolve through
      #      @config/redis-connection.
      #
      # ⚠️ VERIFY THE SECRET'S VALUE BEFORE THE FIRST DEPLOY WITH THIS LINE. It must be
      # redis://…  or rediss://…  (rediss = TLS, which Upstash and most managed providers
      # require). A malformed value now throws AT BOOT by design — better a failed deploy
      # than a service silently talking to nothing. See docs/REDIS_PRODUCTION_SETUP.md.
      #
      # SLACK_WEBHOOK_URL wired (Phase 4 alerts).
      # HEALTHCHECKS_PING_URL wired (dead-man's-switch heartbeat).
      # SUPABASE_* required at boot. EMAIL_PASS is the Gmail app password.
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,METRICS_TOKEN=METRICS_TOKEN:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,HEALTHCHECKS_PING_URL=HEALTHCHECKS_PING_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest,EMAIL_PASS=EMAIL_PASS:latest,AI_SERVICE_KEY=AI_SERVICE_KEY:latest,REDIS_URL=REDIS_URL:latest'
